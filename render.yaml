# Render Blueprint: Go API (Docker) + static Vue frontend.
# Database is external (e.g. Neon) — paste its connection string into DATABASE_URL.
services:
  - type: web
    name: dejaknew-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # e.g. postgres://user:pass@host/db?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false # https://<this-service>.onrender.com
      - key: FRONTEND_URL
        sync: false # https://<frontend>.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false # same as FRONTEND_URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: YANDEX_CLIENT_ID
        sync: false
      - key: YANDEX_CLIENT_SECRET
        sync: false

  - type: web
    name: dejaknew-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false # https://<api-service>.onrender.com/api/v1
    routes:
      # SPA fallback so deep links like /roadmap work on refresh
      - type: rewrite
        source: /*
        destination: /index.html
