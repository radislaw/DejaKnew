<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card">

  <div class="col" style="gap:8px">
    
      <div class="row" style="gap:14px">
        <span class="mono" style="width:30px">1</span>
        <span class="mono" style="width:50px;color:var(--text-muted)">4px</span>
        <div style="height:14px;width:4px;background:var(--accent-bright);border-radius:3px"></div>
      </div>
      <div class="row" style="gap:14px">
        <span class="mono" style="width:30px">2</span>
        <span class="mono" style="width:50px;color:var(--text-muted)">8px</span>
        <div style="height:14px;width:8px;background:var(--accent-bright);border-radius:3px"></div>
      </div>
      <div class="row" style="gap:14px">
        <span class="mono" style="width:30px">3</span>
        <span class="mono" style="width:50px;color:var(--text-muted)">12px</span>
        <div style="height:14px;width:12px;background:var(--accent-bright);border-radius:3px"></div>
      </div>
      <div class="row" style="gap:14px">
        <span class="mono" style="width:30px">4</span>
        <span class="mono" style="width:50px;color:var(--text-muted)">16px</span>
        <div style="height:14px;width:16px;background:var(--accent-bright);border-radius:3px"></div>
      </div>
      <div class="row" style="gap:14px">
        <span class="mono" style="width:30px">6</span>
        <span class="mono" style="width:50px;color:var(--text-muted)">24px</span>
        <div style="height:14px;width:24px;background:var(--accent-bright);border-radius:3px"></div>
      </div>
      <div class="row" style="gap:14px">
        <span class="mono" style="width:30px">8</span>
        <span class="mono" style="width:50px;color:var(--text-muted)">32px</span>
        <div style="height:14px;width:32px;background:var(--accent-bright);border-radius:3px"></div>
      </div>
  </div>

</div>
</body>
</html>
