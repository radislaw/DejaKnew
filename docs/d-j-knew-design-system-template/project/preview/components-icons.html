<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card">

  <div class="row" style="gap:24px">
    <div class="col" style="gap:6px"><div style="font-size:18px;color:var(--text-muted);cursor:pointer">←</div><span class="caption">Back</span></div>
    <div class="col" style="gap:6px"><div style="font-size:14px;color:var(--accent-bright);cursor:pointer">↗</div><span class="caption">External</span></div>
    <div class="col" style="gap:6px"><div style="font-size:14px;color:var(--text-disabled);cursor:pointer">✕</div><span class="caption">Delete · slate-600</span></div>
    <div class="col" style="gap:6px"><div style="font-size:14px;color:var(--error-text);cursor:pointer">✕</div><span class="caption">Delete · hover</span></div>
    <div class="col" style="gap:6px"><div style="font-size:14px;color:var(--text-placeholder)">▼</div><span class="caption">Expand</span></div>
    <div class="col" style="gap:6px"><div style="font-size:14px;color:var(--text-placeholder)">▲</div><span class="caption">Collapse</span></div>
    <div class="col" style="gap:6px"><div style="font-size:14px;color:var(--text-muted)">+</div><span class="caption">Add</span></div>
  </div>
  <div class="caption" style="border-top:1px solid var(--border-default);padding-top:10px">Unicode chars used as icons. Inherit text color & size. Lucide is installed but unused — reach for it when needed.</div>

</div>
</body>
</html>
