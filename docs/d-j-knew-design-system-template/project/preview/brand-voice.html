<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card">

  <div class="col" style="gap:12px">
    <div><span class="label">Empty state</span><div style="font-size:14px;color:var(--text-placeholder);margin-top:4px">No decks yet. Create your first one.</div></div>
    <div><span class="label">Success</span><div style="font-size:20px;color:var(--success-text);font-weight:600;margin-top:4px">Done for today!</div></div>
    <div><span class="label">Error</span><div style="font-size:14px;color:var(--error-text-alt);margin-top:4px">Sign in failed</div></div>
    <div><span class="label">Counter</span><div style="font-size:14px;color:var(--text-muted);margin-top:4px">12 left</div></div>
    <div><span class="label">Placeholder</span><div style="font-size:14px;color:var(--text-placeholder);margin-top:4px">password (min 8 characters)</div></div>
  </div>
  <div class="caption" style="border-top:1px solid var(--border-default);padding-top:10px">Sentence case · "my" not "your" · no emoji · ellipsis as one char (…)</div>

</div>
</body>
</html>
