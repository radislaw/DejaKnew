<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card">

  <div class="col" style="gap:10px">
    <div style="font-size:20px;font-weight:600;letter-spacing:-0.015em">My decks</div>
    <div style="font-size:14px;color:var(--text-placeholder)">No decks yet. Create your first one.</div>
    <div style="font-size:14px;color:var(--text-primary)">+ New deck</div>
    <div style="font-size:14px;color:var(--text-muted)">12 left</div>
    <div style="font-size:24px;font-weight:600;color:var(--success-text);margin-top:4px">Done for today!</div>
    <div style="font-size:14px;color:var(--text-muted)">All cards reviewed. Come back tomorrow for more.</div>
    <div style="font-size:12px;color:var(--text-placeholder);margin-top:6px">tap to reveal</div>
  </div>

</div>
</body>
</html>
