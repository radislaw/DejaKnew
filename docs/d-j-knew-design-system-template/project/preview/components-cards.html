<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card">

  <div style="border:1px solid var(--border-default);background:rgba(30,41,59,0.6);border-radius:12px;padding:16px;">
    <div class="row" style="justify-content:space-between;align-items:flex-start;gap:8px">
      <div class="col" style="gap:6px;flex:1">
        <div style="font-size:14px;font-weight:500;color:var(--text-primary)">JavaScript fundamentals</div>
        <div style="font-size:12px;color:var(--text-muted)">Hoisting, closures, the event loop — daily review.</div>
        <div class="row" style="gap:6px;margin-top:2px">
          <span class="badge badge-default">js</span>
          <span class="badge badge-default">basics</span>
        </div>
      </div>
      <div style="font-size:14px;color:var(--text-disabled);cursor:pointer">✕</div>
    </div>
  </div>
  <div style="border:1px solid var(--border-hover);background:rgba(30,41,59,0.6);border-radius:12px;padding:16px;">
    <div class="row" style="justify-content:space-between;align-items:flex-start;gap:8px">
      <div class="col" style="gap:6px;flex:1">
        <div style="font-size:14px;font-weight:500;color:var(--accent-bright)">Rust ownership</div>
        <div style="font-size:12px;color:var(--text-muted)">Borrowing, lifetimes, Send/Sync.</div>
      </div>
      <div style="font-size:14px;color:var(--error-text);cursor:pointer">✕</div>
    </div>
  </div>
  <div class="caption">resting · hover (border-slate-500, action revealed)</div>

</div>
</body>
</html>
