<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card">

  <div class="grid-4" style="grid-template-columns:repeat(4,1fr); gap:12px">
    
      <div class="col" style="gap:6px">
        <div style="height:80px;background:rgba(30,41,59,0.6);border:1px solid var(--border-default);border-radius:8px"></div>
        <div class="sw-name">rounded-lg</div>
        <div class="sw-hex">8px · buttons · inputs</div>
      </div>
      <div class="col" style="gap:6px">
        <div style="height:80px;background:rgba(30,41,59,0.6);border:1px solid var(--border-default);border-radius:12px"></div>
        <div class="sw-name">rounded-xl</div>
        <div class="sw-hex">12px · panels</div>
      </div>
      <div class="col" style="gap:6px">
        <div style="height:80px;background:rgba(30,41,59,0.6);border:1px solid var(--border-default);border-radius:16px"></div>
        <div class="sw-name">rounded-2xl</div>
        <div class="sw-hex">16px · flashcard</div>
      </div>
      <div class="col" style="gap:6px">
        <div style="height:80px;background:rgba(30,41,59,0.6);border:1px solid var(--border-default);border-radius:999px"></div>
        <div class="sw-name">rounded-full</div>
        <div class="sw-hex">9999px · pills</div>
      </div>
  </div>

</div>
</body>
</html>
