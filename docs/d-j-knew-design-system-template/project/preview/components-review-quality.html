<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card">

  <div class="grid-4">
    <button class="btn" style="border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--error-text);padding:12px 0;border-radius:12px;font-weight:500">Again</button>
    <button class="btn" style="border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--warn-text);padding:12px 0;border-radius:12px;font-weight:500">Hard</button>
    <button class="btn" style="border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--good-text);padding:12px 0;border-radius:12px;font-weight:500">Good</button>
    <button class="btn" style="border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--easy-text);padding:12px 0;border-radius:12px;font-weight:500">Easy</button>
  </div>
  <div class="grid-4">
    <div style="border:1px solid var(--border-subtle);background:rgba(127,29,29,0.3);color:var(--error-text);padding:12px 0;border-radius:12px;font-weight:500;font-size:14px;text-align:center">Again</div>
    <div style="border:1px solid var(--border-subtle);background:rgba(124,45,18,0.3);color:var(--warn-text);padding:12px 0;border-radius:12px;font-weight:500;font-size:14px;text-align:center">Hard</div>
    <div style="border:1px solid var(--border-subtle);background:rgba(12,74,110,0.3);color:var(--good-text);padding:12px 0;border-radius:12px;font-weight:500;font-size:14px;text-align:center">Good</div>
    <div style="border:1px solid var(--border-subtle);background:rgba(6,78,59,0.3);color:var(--easy-text);padding:12px 0;border-radius:12px;font-weight:500;font-size:14px;text-align:center">Easy</div>
  </div>
  <div class="caption">resting · hover (filled wash)</div>

</div>
</body>
</html>
