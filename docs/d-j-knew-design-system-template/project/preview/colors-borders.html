<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card">

  <div class="grid-4" style="grid-template-columns:repeat(4,1fr); gap:10px">
    
  <div class="sw">
    <div class="sw-chip" style="background:#334155"></div>
    <div class="sw-name">slate-700</div>
    <div class="sw-hex">default</div>
  </div>
    
  <div class="sw">
    <div class="sw-chip" style="background:#475569"></div>
    <div class="sw-name">slate-600</div>
    <div class="sw-hex">subtle</div>
  </div>
    
  <div class="sw">
    <div class="sw-chip" style="background:#64748b"></div>
    <div class="sw-name">slate-500</div>
    <div class="sw-hex">hover</div>
  </div>
    
  <div class="sw">
    <div class="sw-chip" style="background:#38bdf8"></div>
    <div class="sw-name">sky-400</div>
    <div class="sw-hex">focus</div>
  </div>
  </div>
  <div class="grid-4" style="grid-template-columns:repeat(3,1fr); gap:10px">
    <div style="border:1px solid #334155; background:rgba(30,41,59,0.6); border-radius:12px; padding:12px; font-size:13px; color:var(--text-secondary)">resting</div>
    <div style="border:1px solid #64748b; background:rgba(30,41,59,0.6); border-radius:12px; padding:12px; font-size:13px; color:var(--text-primary)">hover</div>
    <div style="border:1px solid #38bdf8; background:var(--bg-surface-solid); border-radius:8px; padding:12px; font-size:13px; color:var(--text-primary)">focused input</div>
  </div>

</div>
</body>
</html>
