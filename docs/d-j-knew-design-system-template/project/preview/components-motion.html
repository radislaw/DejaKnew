<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card">

  <div class="row" style="gap:20px;align-items:stretch">
    <div class="col" style="gap:6px;flex:1">
      <div class="label">Flip · 500ms</div>
      <div style="position:relative;height:90px;border:1px solid var(--border-default);border-radius:12px;overflow:hidden;background:rgba(30,41,59,0.6);">
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:var(--text-primary);opacity:0.6;transform:scale(0.95)">Front</div>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-secondary);opacity:0.4">Back</div>
      </div>
      <span class="caption">opacity + scale-95, ease</span>
    </div>
    <div class="col" style="gap:6px;flex:1">
      <div class="label">Color · 150ms</div>
      <div style="height:90px;border:1px solid var(--border-default);border-radius:12px;background:rgba(30,41,59,0.6);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-muted)">border · text · bg</div>
      <span class="caption">Tailwind default transition</span>
    </div>
  </div>
  <div class="caption" style="border-top:1px solid var(--border-default);padding-top:10px">No springs · no bounces · no transforms outside flip · no 3D rotation</div>

</div>
</body>
</html>
