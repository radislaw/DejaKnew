<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card">

  <div class="grid-3" style="grid-template-columns:repeat(4,1fr); gap:10px">
    
  <div class="sw">
    <div class="sw-chip" style="background:#070d1c"></div>
    <div class="sw-name">page</div>
    <div class="sw-hex">--bg-page</div>
  </div>
    
  <div class="sw">
    <div class="sw-chip" style="background:rgba(30,41,59,0.6)"></div>
    <div class="sw-name">surface 60%</div>
    <div class="sw-hex">slate-800/60</div>
  </div>
    
  <div class="sw">
    <div class="sw-chip" style="background:#0f172a"></div>
    <div class="sw-name">surface solid</div>
    <div class="sw-hex">slate-900 · inputs</div>
  </div>
    
  <div class="sw">
    <div class="sw-chip" style="background:#1e293b"></div>
    <div class="sw-name">elevated</div>
    <div class="sw-hex">slate-800 · hover</div>
  </div>
  </div>
  <div style="border:1px solid var(--border-default); background:var(--bg-surface); border-radius:12px; padding:12px;">
    <div class="caption" style="margin-bottom:6px">card on page · translucent</div>
    <input class="input" placeholder="email" />
  </div>

</div>
</body>
</html>
