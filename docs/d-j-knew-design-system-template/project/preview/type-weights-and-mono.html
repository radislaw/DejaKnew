<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card">

  <div class="grid-2" style="grid-template-columns:repeat(4,1fr); gap:12px">
    <div><span class="label">400</span><div style="font-size:18px;font-weight:400">Inter</div></div>
    <div><span class="label">500</span><div style="font-size:18px;font-weight:500">Inter</div></div>
    <div><span class="label">600</span><div style="font-size:18px;font-weight:600">Inter</div></div>
    <div><span class="label">700</span><div style="font-size:18px;font-weight:700">Inter</div></div>
  </div>
  <div class="col" style="gap:4px">
    <span class="label">JetBrains Mono · cards render markdown</span>
    <pre style="font-family:var(--font-mono);font-size:13px;background:var(--bg-surface-solid);border:1px solid var(--border-default);border-radius:8px;padding:10px 12px;color:var(--text-secondary);overflow:auto"><span style="color:var(--accent-bright)">const</span> hoisting = <span style="color:var(--easy-text)">'before declaration'</span>;</pre>
  </div>

</div>
</body>
</html>
