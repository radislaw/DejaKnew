<!doctype html>
<html lang="en">
<head>

<body>
<div class="card">

  <div style="border:1px solid var(--border-default);background:rgba(30,41,59,0.6);border-radius:16px;padding:24px;min-height:200px">
    <p style="font-size:14px;color:var(--text-secondary);line-height:1.55;margin-bottom:10px">The declaration is hoisted to the top of the function scope and initialized to <code style="font-family:var(--font-mono);color:var(--accent-bright);background:var(--bg-surface-solid);padding:1px 6px;border-radius:4px;font-size:13px">undefined</code>.</p>
    <pre style="font-family:var(--font-mono);font-size:12px;background:var(--bg-surface-solid);border:1px solid var(--border-subtle);border-radius:8px;padding:10px;color:var(--text-secondary);overflow:auto;margin-bottom:14px">console.log(x); <span style="color:var(--text-placeholder)">// undefined</span>
var x = 1;</pre>
    <div class="row" style="gap:6px;margin-bottom:10px">
      <span style="font-size:12px;color:var(--text-muted);background:rgba(51,65,85,0.6);border-radius:9999px;padding:2px 8px">#js</span>
      <span style="font-size:12px;color:var(--text-muted);background:rgba(51,65,85,0.6);border-radius:9999px;padding:2px 8px">#hoisting</span>
    </div>
    <a style="font-size:12px;color:var(--accent-bright);text-decoration:none">Source ↗</a>
  </div>

</div>
