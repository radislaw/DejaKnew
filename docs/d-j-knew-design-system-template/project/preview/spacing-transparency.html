<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card">

  <div style="position:relative;height:140px;border-radius:12px;overflow:hidden;background:var(--bg-page)">
    <div style="position:absolute;left:24px;top:24px;width:180px;height:96px;border-radius:12px;border:1px solid var(--border-default);background:rgba(30,41,59,0.6)"></div>
    <div style="position:absolute;left:120px;top:50px;width:180px;height:80px;border-radius:12px;border:1px solid var(--border-hover);background:rgba(30,41,59,0.6)"></div>
    <div style="position:absolute;left:230px;top:24px;width:180px;height:60px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-surface-solid)"></div>
    <div style="position:absolute;right:24px;top:24px;font-size:12px;color:var(--text-placeholder);font-family:var(--font-mono)">no shadows<br>no blur<br>α + borders</div>
  </div>
  <div class="row" style="gap:18px">
    <span class="mono">bg-slate-800/60 over #070d1c</span>
  </div>

</div>
</body>
</html>
