<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card">

  <div class="grid-4" style="grid-template-columns:repeat(4,1fr);gap:10px">
    
  <div class="sw">
    <div class="sw-chip" style="background:#f87171"></div>
    <div class="sw-name">red-400</div>
    <div class="sw-hex">Again · error</div>
  </div>
    
  <div class="sw">
    <div class="sw-chip" style="background:#fb923c"></div>
    <div class="sw-name">orange-400</div>
    <div class="sw-hex">Hard</div>
  </div>
    
  <div class="sw">
    <div class="sw-chip" style="background:#38bdf8"></div>
    <div class="sw-name">sky-400</div>
    <div class="sw-hex">Good</div>
  </div>
    
  <div class="sw">
    <div class="sw-chip" style="background:#34d399"></div>
    <div class="sw-name">emerald-400</div>
    <div class="sw-hex">Easy · done</div>
  </div>
  </div>
  <div class="grid-4" style="margin-top:6px">
    <button class="btn" style="border:1px solid var(--border-subtle); background:var(--bg-elevated); color:var(--error-text); padding:12px 0; border-radius:12px; font-weight:500;">Again</button>
    <button class="btn" style="border:1px solid var(--border-subtle); background:var(--bg-elevated); color:var(--warn-text); padding:12px 0; border-radius:12px; font-weight:500;">Hard</button>
    <button class="btn" style="border:1px solid var(--border-subtle); background:var(--bg-elevated); color:var(--good-text); padding:12px 0; border-radius:12px; font-weight:500;">Good</button>
    <button class="btn" style="border:1px solid var(--border-subtle); background:var(--bg-elevated); color:var(--easy-text); padding:12px 0; border-radius:12px; font-weight:500;">Easy</button>
  </div>

</div>
</body>
</html>
