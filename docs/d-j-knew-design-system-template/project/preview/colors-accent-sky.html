<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card">

  <div class="grid-3" style="grid-template-columns:repeat(4,1fr); gap:10px">
    
  <div class="sw">
    <div class="sw-chip" style="background:#7dd3fc"></div>
    <div class="sw-name">sky-300</div>
    <div class="sw-hex">bright hover</div>
  </div>
    
  <div class="sw">
    <div class="sw-chip" style="background:#38bdf8"></div>
    <div class="sw-name">sky-400</div>
    <div class="sw-hex">focus · link · CTA</div>
  </div>
    
  <div class="sw">
    <div class="sw-chip" style="background:#0ea5e9"></div>
    <div class="sw-name">sky-500</div>
    <div class="sw-hex">accent hover</div>
  </div>
    
  <div class="sw">
    <div class="sw-chip" style="background:#0284c7"></div>
    <div class="sw-name">sky-600</div>
    <div class="sw-hex">primary button</div>
  </div>
  </div>
  <div class="row" style="margin-top:4px">
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-primary-lg">Sign in</button>
    <a style="color:var(--accent-bright);font-size:14px;text-decoration:none">link</a>
    <span class="badge badge-accent">JS · Уровень 1</span>
  </div>

</div>
</body>
</html>
