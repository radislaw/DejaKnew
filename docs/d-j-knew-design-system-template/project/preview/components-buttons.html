<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card">

  <div class="row" style="gap:14px">
    <button class="btn btn-primary">+ New deck</button>
    <button class="btn btn-primary-lg">Sign in</button>
    <button class="btn btn-success">Study</button>
    <button class="btn btn-ghost">Cancel</button>
    <button class="btn btn-primary" style="opacity:0.5">Disabled</button>
  </div>
  <div class="grid-2" style="grid-template-columns:repeat(5,1fr); gap:8px">
    <span class="mono" style="font-size:10px">sky-600</span>
    <span class="mono" style="font-size:10px">sky-400</span>
    <span class="mono" style="font-size:10px">emerald-600</span>
    <span class="mono" style="font-size:10px">ghost</span>
    <span class="mono" style="font-size:10px">opacity-50</span>
  </div>

</div>
</body>
</html>
