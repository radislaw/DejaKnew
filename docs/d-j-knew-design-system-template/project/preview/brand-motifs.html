<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card">

  <div class="col" style="gap:10px">
    <div class="row" style="gap:12px"><div style="width:8px;height:8px;background:var(--accent-bright);border-radius:2px"></div><span style="font-size:13px;color:var(--text-secondary)">Translucent slate panel over near-black-navy</span></div>
    <div class="row" style="gap:12px"><div style="width:8px;height:8px;background:var(--accent-bright);border-radius:2px"></div><span style="font-size:13px;color:var(--text-secondary)">Hairline borders that lighten on hover</span></div>
    <div class="row" style="gap:12px"><div style="width:8px;height:8px;background:var(--accent-bright);border-radius:2px"></div><span style="font-size:13px;color:var(--text-secondary)">Sky for "go", emerald for "study", semantic colors for the 4 ratings</span></div>
    <div class="row" style="gap:12px"><div style="width:8px;height:8px;background:var(--accent-bright);border-radius:2px"></div><span style="font-size:13px;color:var(--text-secondary)">No emoji · no gradients · no shadows · no imagery</span></div>
    <div class="row" style="gap:12px"><div style="width:8px;height:8px;background:var(--accent-bright);border-radius:2px"></div><span style="font-size:13px;color:var(--text-secondary)">Hover-reveal hidden actions (opacity-0 → opacity-100)</span></div>
    <div class="row" style="gap:12px"><div style="width:8px;height:8px;background:var(--accent-bright);border-radius:2px"></div><span style="font-size:13px;color:var(--text-secondary)">Negative space is the decoration</span></div>
  </div>

</div>
</body>
</html>
